<header>
    <div class="logo-container">
      <img src="assets/logo.png" alt="Logo" class="logo">
      <h1>{{ pageTitle }}</h1>
    </div>
    <div class="nav-bar">
      <button 
        [class.active]="activeSection === 'users'"
        (click)="navigateToUsers()">
        <i class="material-icons">group</i> Utilisateurs
      </button>
      <button 
        [class.active]="activeSection === 'roles'"
        (click)="navigateToRoles()">
        <i class="material-icons">verified_user</i> Rôles
      </button>
      <button 
        [class.active]="activeSection === 'agences'"
        (click)="navigateToAgences()">
        <i class="material-icons">business</i> Agences
      </button>
    </div>
    <div class="user-controls">
      <div class="user-profile">
        <div class="user-avatar">
          <i class="material-icons">person</i>
        </div>
        <div class="user-info">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">{{ userRole }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">
        <i class="material-icons" style="font-size: 18px;">logout</i>
        <span>Déconnexion</span>
      </button>
    </div>
  </header>
