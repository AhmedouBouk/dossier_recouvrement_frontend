<app-navigation-header
  [activeSection]="'roles'"
  [pageTitle]="'Gestion des Rôles'">
</app-navigation-header>
  
  <main class="main-content">
    <div class="container">
      <div class="actions-bar">
        <button class="add-role-btn" (click)="openForm()">
          <i class="material-icons">add</i>
          Nouveau Rôle
        </button>
      </div>
  
      <!-- Popup Form for Adding/Editing Role -->
      <div class="popup-overlay" *ngIf="showForm">
        <div class="popup-content">
          <h2>{{ isEditing ? 'Modifier' : 'Créer' }} un Rôle</h2>
          <form [formGroup]="roleForm" (ngSubmit)="submitRole()">
            <label>Nom du Rôle:</label>
            <input type="text" formControlName="roleName" required>
  
            <label>Permissions:</label>
            <div class="permissions" formArrayName="permissions">
              <label *ngFor="let perm of allPermissions; let i = index">
                <input type="checkbox" 
                       [value]="perm" 
                       [checked]="isPermissionSelected(perm)"
                       (change)="onPermissionChange($event, perm)">
                {{ perm }}
              </label>
            </div>
              
  
            <div class="form-buttons">
              <button type="submit">{{ isEditing ? 'Modifier' : 'Créer' }}</button>
              <button type="button" class="cancel-btn" (click)="closeForm()">Annuler</button>
            </div>
          </form>
        </div>
      </div>
  
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Permissions</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let role of roles">
              <td>{{ role.name }}</td>
              <td>
                <div class="permission-chips">
                  <span *ngFor="let perm of role.permissions" 
                        class="permission-chip" 
                        [ngClass]="getPermissionClass(perm)">
                    {{ getPermissionDisplay(perm) }}
                  </span>
                </div>
              </td>
              <td>
                <div class="action-buttons">
                  <button class="edit-btn" (click)="openForm(role)">Modifier</button>
                  <button class="delete-btn" (click)="deleteRole(role.id)">Supprimer</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
