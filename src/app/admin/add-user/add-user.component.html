<div class="page-container">
  <div class="add-user-container">
    <div class="header">
      <h1>Ajouter un utilisateur</h1>
      
    </div>

    <form (ngSubmit)="onSubmit()" #addUserForm="ngForm" autocomplete="off">
      <!-- Champs cachés pour tromper l'autocomplétion -->
      <input type="text" name="_username" style="display:none">
      <input type="password" name="_password" style="display:none">
      
      <div class="form-group">
        <label for="name">Name</label>
        <div class="input-wrapper">
          <i class="material-icons">person_outline</i>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="user.name"
            required
            minlength="2"
            class="form-control"
            placeholder="Enter user name"
            autocomplete="off"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Username</label>
        <div class="input-wrapper">
          <i class="material-icons">account_circle</i>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="user.email"
            required
            class="form-control"
            placeholder="Enter Username"
            autocomplete="off"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="material-icons">lock</i>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="user.password"
            required
            minlength="6"
            class="form-control"
            placeholder="Enter password"
            autocomplete="new-password"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <div class="input-wrapper">
          <i class="material-icons">badge</i>
          <select id="role" name="role" [(ngModel)]="user.role" required class="form-control" autocomplete="off">
            <option value="" disabled selected>Select a role</option>
            <option *ngFor="let role of roles" [value]="role.name">{{ role.name }}</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="userType">Type d'utilisateur</label>
        <div class="input-wrapper">
          <i class="material-icons">person_outline</i>
          <select id="userType" name="userType" [(ngModel)]="user.userType" (change)="onUserTypeChange()" required class="form-control" autocomplete="off">
            <option value="" disabled selected>Sélectionner un type</option>
            <option value="Agence">Agence</option>
            <option value="Recouvrement">Recouvrement</option>
            <option value="Risque">Risque</option>
            <option value="Do">Do</option>
          </select>
        </div>
      </div>

      <div class="form-group" *ngIf="showAgenceField">
        <label for="agence">Agence</label>
        <div class="input-wrapper">
          <i class="material-icons">business</i>
          <select id="agence" name="agence" [(ngModel)]="user.agence" required class="form-control" autocomplete="off">
            <option value="" disabled selected>Select an agency</option>
            <option *ngFor="let agence of agences" [value]="agence.id">{{ agence.nom }} ({{ agence.code }}) - ID: {{ agence.id }}</option>
          </select>
        </div>
      </div>

      <div class="button-group">
        <button type="button" class="btn btn-secondary" (click)="navigateBack()">
          <i class="material-icons">arrow_back</i>
          Back
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="!addUserForm.form.valid">
          <i class="material-icons">person_add</i>
          Add User
        </button>
      </div>
    </form>

    <div *ngIf="successMessage" class="alert alert-success">
      <i class="material-icons">check_circle</i>
      {{ successMessage }}
    </div>
  </div>
</div>
