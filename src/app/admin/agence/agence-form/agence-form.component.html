<form [formGroup]="agenceForm" (ngSubmit)="onSubmit()" class="agence-form">
  <div class="form-group">
    <label for="code">Code de l'agence *</label>
    <input 
      type="text" 
      id="code" 
      formControlName="code" 
       class="compact-input"
      [ngClass]="{ 'is-invalid': submitted && f['code'].errors }"
    >
    <div *ngIf="submitted && f['code'].errors" class="error-message">
      <div *ngIf="f['code'].errors['required']">Le code de l'agence est requis</div>
      <div *ngIf="f['code'].errors['maxlength']">Le code ne doit pas dépasser 20 caractères</div>
    </div>
  </div>

  <div class="form-group">
    <label for="nom">Nom de l'agence *</label>
    <input 
      type="text" 
      id="nom" 
      formControlName="nom" 
       class="compact-input"
      [ngClass]="{ 'is-invalid': submitted && f['nom'].errors }"
    >
    <div *ngIf="submitted && f['nom'].errors" class="error-message">
      <div *ngIf="f['nom'].errors['required']">Le nom de l'agence est requis</div>
      <div *ngIf="f['nom'].errors['maxlength']">Le nom ne doit pas dépasser 100 caractères</div>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Annuler</button>
    <button type="submit" class="btn-primary">
      {{ agence ? 'Mettre à jour' : 'Créer' }}
    </button>
  </div>
</form>
