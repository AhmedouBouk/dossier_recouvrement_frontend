<!-- Dossiers Recouvrement Modern Split-Screen Login Interface -->
<div class="login-container">
  <!-- Top Left Logo -->
  <div class="top-logo-section">
    <img src="assets/logo.png" alt="Logo" class="top-logo" />
    <div class="institution-name">
      <h3 class="institution-title">Gestion des Dossiers de Recouvrement</h3>
    </div>
  </div>

  <!-- Left Side - Login Form -->
  <div class="login-form-section">
    <div class="form-content">
      <!-- Login Title -->
      <h1 class="login-title">Se connecter</h1>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" autocomplete="off">
        <!-- Champs cachés pour tromper l'autocomplétion -->
        <input type="text" name="_username" style="display:none">
        <input type="password" name="_password" style="display:none">
        
        <!-- Email Field -->
        <div class="form-group">
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Email</mat-label>
            <input 
              matInput 
              id="email"
              type="email" 
              formControlName="email" 
              placeholder="exemple@email.com"
              autocomplete="email"
              (input)="onInputChange()"
            />
            <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              {{ getErrorMessage('email') }}
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Mot de passe</mat-label>
            <input 
              matInput 
              id="password"
              [type]="passwordVisible ? 'text' : 'password'" 
              formControlName="password"
              autocomplete="current-password"
              (input)="onInputChange()"
            />
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="passwordVisible"
            >
              <mat-icon>{{passwordVisible ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
              {{ getErrorMessage('password') }}
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="error-alert">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Sign In Button -->
        <button 
          mat-raised-button 
          type="submit" 
          class="signin-button"
          color="primary"
          [disabled]="isLoading || loginForm.invalid"
        >

          <span class="button-text">
            {{ isLoading ? 'Connexion...' : 'Se connecter' }}
          </span>
        </button>
      </form>
    </div>
  </div>

  <!-- Right Side - Clean Logo and Message -->
  <div class="login-content-section">
    <!-- Background Design Elements -->
    <div class="background-elements">
      <div class="floating-circle circle-1"></div>
      <div class="floating-circle circle-2"></div>
      <div class="floating-shape shape-1"></div>
    </div>

    <div class="content-wrapper">
      <h2 class="content-title">Dossiers de Recouvrement</h2>
      
      <!-- Logo as Main Illustration -->
      <div class="logo-illustration">
        <div class="logo-container">
          <img src="assets/logo.png" alt="Logo" class="main-logo" />
          <div class="logo-backdrop"></div>
        </div>
      </div>
    </div>
  </div>
</div>
