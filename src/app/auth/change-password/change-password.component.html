<!-- Change Password Modern Interface -->
<div class="change-password-container">
  <!-- Background Design Elements -->
  <div class="background-elements">
    <div class="floating-circle circle-1"></div>
    <div class="floating-circle circle-2"></div>
    <div class="floating-shape shape-1"></div>
  </div>

  <div class="change-password-card">
    <!-- Logo Section -->
    <div class="logo-container">
      <img src="assets/logo.png" alt="Logo" class="logo">
      <div class="logo-backdrop"></div>
    </div>

    <!-- Header Section -->
    <div class="header-section">
      <h2 class="page-title">Changement de mot de passe</h2>
      
    </div>
    
    <!-- Form Section -->
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="password-form">
      <!-- New Password Field -->
      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nouveau mot de passe</mat-label>
          <input 
            matInput 
            [type]="hidePassword ? 'password' : 'text'" 
            formControlName="newPassword"
            placeholder="Entrez votre nouveau mot de passe"
          >
          <button 
            mat-icon-button 
            matSuffix 
            (click)="hidePassword = !hidePassword" 
            type="button"
            [attr.aria-label]="'Toggle password visibility'"
          >
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="passwordForm.get('newPassword')?.errors?.['required']">
            Le mot de passe est requis
          </mat-error>
          <mat-error *ngIf="passwordForm.get('newPassword')?.errors?.['minlength']">
            Le mot de passe doit contenir au moins 8 caractères
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmer le mot de passe</mat-label>
          <input 
            matInput 
            [type]="hideConfirmPassword ? 'password' : 'text'" 
            formControlName="confirmPassword"
            placeholder="Confirmez votre nouveau mot de passe"
          >
          <button 
            mat-icon-button 
            matSuffix 
            (click)="hideConfirmPassword = !hideConfirmPassword" 
            type="button"
            [attr.aria-label]="'Toggle confirm password visibility'"
          >
            <mat-icon>{{hideConfirmPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="passwordForm.get('confirmPassword')?.errors?.['required']">
            La confirmation du mot de passe est requise
          </mat-error>
          <mat-error *ngIf="passwordForm.get('confirmPassword')?.errors?.['passwordMismatch']">
            Les mots de passe ne correspondent pas
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Error Alert -->
      <div class="alert alert-danger" *ngIf="error">
        <mat-icon>error_outline</mat-icon>
        <span>{{ error }}</span>
      </div>

      <!-- Success Alert -->
      <div class="alert alert-success" *ngIf="success">
        <mat-icon>check_circle_outline</mat-icon>
        <span>{{ success }}</span>
      </div>

      <!-- Submit Button -->
      <div class="form-group">
        <button 
          mat-raised-button 
          color="primary" 
          type="submit" 
          [disabled]="passwordForm.invalid || loading" 
          class="submit-button"
        >
          <span class="button-text">
            {{ loading ? 'Changement en cours...' : 'Changer le mot de passe' }}
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
