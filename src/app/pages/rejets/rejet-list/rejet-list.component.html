<div class="main-content">
  <div class="container">

    <!-- Message d'erreur -->
    <div *ngIf="error" class="error-message">
      <i class="material-icons">error</i>
      {{ error }}
    </div>

    <!-- Chargement -->
    <div *ngIf="loading" class="loading-state">
      <i class="material-icons rotating">sync</i>
      Chargement en cours...
    </div>

    <!-- Tableau des rejets par dossier -->
    <div *ngIf="!loading" class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID Dossier</th>
            <th>Motifs de rejet</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let entry of groupedRejets | keyvalue">
            <td>
              <a [routerLink]="['/dossiers', entry.key]" class="link-id">
                {{ entry.key }}
              </a>
            </td>
            <td class="garanties-container">
              <div *ngFor="let rejet of entry.value" class="garantie-item">
                <div class="garantie-row">
                  <div class="garantie-cell motif-text">
                    {{ rejet.motif }}
                  </div>
                  <div class="garantie-cell garantie-date">
                    {{ rejet.dateRejet | date:'dd/MM/yyyy HH:mm' }}
                  </div>
                  <div class="garantie-cell garantie-actions">
                    <span class="badge" [ngClass]="rejet.traite ? 'badge-success' : 'badge-warning'">
                      {{ rejet.traite ? 'Traité' : 'En attente' }}
                    </span>
                    <button
                      *ngIf="!isRecouvrementUser"
                      class="btn btn-sm btn-success"
                      (click)="marquerCommeTraite(rejet, $event)"
                      [disabled]="rejet.traite"
                      [attr.aria-label]="rejet.traite ? 'Déjà traité' : 'Marquer comme traité'">
                      {{ rejet.traite ? 'Traité' : 'Traiter' }}
                    </button>
                  </div>
                </div>
              </div>
            </td>
            <td>
              <span class="no-file" *ngIf="entry.value.length === 0">Aucun rejet</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Aucun rejet -->
    <div *ngIf="!loading && filteredRejets.length === 0" class="no-dossiers-message">
      <i class="material-icons">assignment_late</i>
      <p>Aucun motif de rejet trouvé</p>
    </div>

  </div>
</div>
