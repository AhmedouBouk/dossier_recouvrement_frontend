<div class="main-content">
  <div class="container">

    <!-- Message d'erreur -->
    <div *ngIf="error" class="error-message">
      <i class="material-icons">error</i>
      {{ error }}
    </div>

   

    <!-- Indicateur de chargement -->
    <div *ngIf="loading" class="loading-state">
      <i class="material-icons rotating">sync</i>
      Chargement en cours...
    </div>

    <!-- Tableau des motifs de rejet -->
    <div *ngIf="!loading" class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID Dossier</th>
            <th>Motif</th>
            <th>Date de rejet</th>
            <th>Rejeté par</th>
            <th>État</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let rejet of filteredRejets" 
              [ngClass]="{'table-success': rejet.traite}">
            <td class="p-0">
              <button class="btn btn-link text-left w-100 clickable-cell" 
                      (click)="viewDossier(rejet.dossier.id)" 
                      [attr.aria-label]="'Voir le dossier ' + rejet.dossier.id">
                {{ rejet.dossier.id }}
              </button>
            </td>
            <td class="p-0">
              <button class="btn btn-link text-left w-100 clickable-cell" 
                      (click)="viewDossier(rejet.dossier.id)">
                {{ rejet.motif }}
              </button>
            </td>
            <td>{{ rejet.dateRejet | date:'dd/MM/yyyy HH:mm' }}</td>
            <td>{{ rejet.rejetePar.name }}</td>
            <td>
              <span class="badge" [ngClass]="rejet.traite ? 'badge-success' : 'badge-warning'">
                {{ rejet.traite ? 'Traité' : 'En attente' }}
              </span>
            </td>
            <td>
              <button class="btn btn-sm" [ngClass]="rejet.traite ? 'btn-outline-secondary' : 'btn-success'" 
                      (click)="marquerCommeTraite(rejet, $event)"
                      [disabled]="rejet.traite"
                      [attr.aria-label]="rejet.traite ? 'Déjà traité' : 'Marquer comme traité'">
                {{ rejet.traite ? 'Traité' : 'Marquer comme traité' }}
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Aucun motif de rejet trouvé -->
    <div *ngIf="!loading && (!filteredRejets || filteredRejets.length === 0)" class="no-dossiers-message">
      <i class="material-icons">assignment_late</i>
      <p>Aucun motif de rejet trouvé</p>
    </div>
  </div>
</div>
