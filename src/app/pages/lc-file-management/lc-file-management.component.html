<!-- src/app/pages/lc-file-management/lc-file-management.component.html -->
<div class="main-content">
  <div class="container">
    <!-- Barre de recherche et actions -->
    

    <!-- Indicateur de chargement -->
    <div *ngIf="isLoading" class="loading-state">
      <i class="material-icons rotating">sync</i>
      Chargement en cours...
    </div>

    <!-- Tableau des fichiers LC -->
    <div *ngIf="!isLoading" class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID Dossier</th>
            <th>N° Compte</th>
            <th>Fichier LC</th>
            <th>Date de Création</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let dossier of dossiers">
<td>
  <a [routerLink]="['/dossiers/view', dossier.id]" class="link-id">
    {{ dossier.id }}
  </a>
</td>
            <td>{{ dossier.compte.nomCompte }}</td>
            <td>
              <span *ngIf="dossier.lcFile; else noFile">
                {{ dossier.lcFile }}
              </span>
              <ng-template #noFile>
                <span class="no-file">Aucun fichier</span>
              </ng-template>
            </td>
            <td>{{ dossier.dateCreation }}</td>
           <td>
  <div class="action-buttons">
    <!-- Input invisible -->
    <input 
      type="file"
      (change)="onLcFileSelectedAndUpload($event, dossier)" 
      accept=".pdf"
      hidden
      id="lc-file-upload-{{ dossier.id }}"
    />

    <!-- Bouton CHOISIR & UPLOADER AUTOMATIQUEMENT -->
    <label   *ngIf="roleService.hasUploadLcFilePermission() && dossier.status !== 'Clôturé'" 

      for="lc-file-upload-{{ dossier.id }}" 
      class="icon-btn upload-btn"
      data-tooltip="Téléverser"
    >
      <i class="material-icons">file_upload</i>
    </label>

    <!-- Bouton Visualiser -->
    <button
      class="icon-btn view-btn"
      data-tooltip="Visualiser"
      (click)="viewLcFile(dossier)"
      [disabled]="!dossier.lcFile"
    >
      <i class="material-icons">visibility</i>
    </button>

    <!-- Bouton Télécharger -->
    <button 
      class="icon-btn download-btn"
      data-tooltip="Télécharger"
      (click)="viewLcFile(dossier, true)"
      [disabled]="!dossier.lcFile"
    >
      <i class="material-icons">download</i>
    </button>

    <!-- Bouton Supprimer -->
    <button 
      *ngIf="dossier.status !== 'Clôturé'" 
      class="icon-btn delete-btn"
      data-tooltip="Supprimer"
      (click)="deleteLcFile(dossier)"
      [disabled]="!dossier.lcFile"
    >
      <i class="material-icons">delete</i>
    </button>
  </div>
</td>

          </tr>
        </tbody>
      </table>
    </div>

    <!-- Messages d'erreur ou de succès -->
    <div *ngIf="errorMessage" class="error-message">
      <i class="material-icons">error</i>
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="no-dossiers-message">
      <i class="material-icons">check_circle</i>
      <p>{{ successMessage }}</p>
    </div>

    <!-- Message si aucun dossier n'est trouvé -->
    <div *ngIf="!isLoading && dossiers.length === 0" class="no-dossiers-message">
      <i class="material-icons">folder_off</i>
      <p>Aucun dossier trouvé</p>
    </div>
  </div>
</div>
