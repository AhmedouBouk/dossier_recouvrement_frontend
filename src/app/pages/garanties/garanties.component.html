<div class="main-content">
  <div class="container">
    <!-- Barre de recherche et actions -->
    <div class="actions-bar">
    
    </div>

    <!-- Indicateur de chargement -->
    <div *ngIf="isLoading" class="loading-state">
      <i class="material-icons rotating">sync</i>
      Chargement en cours...
    </div>

    <!-- Tableau des garanties -->
    <div *ngIf="!isLoading" class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID Dossier</th>
            <th>N° Compte</th>
            <th>Titre de la Garantie</th>
            <th>Date de Création</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let dossier of dossiers">
            <td>{{ dossier.id }}</td>
            <td>{{ dossier.compte.nomCompte }}</td>
            <td>
              <input [(ngModel)]="dossier.garantiesTitre" placeholder="Titre de la garantie" />
            </td>
            <td>{{ dossier.dateCreation }}</td>
            <td>
              <div class="action-buttons">
                <input type="file" (change)="onFileUpload($event, dossier)" accept=".pdf" hidden id="file-upload-{{ dossier.id }}" />
                <label for="file-upload-{{ dossier.id }}" class="upload-btn">
                  <i class="material-icons">file_upload</i>
                  Sélectionner
                </label>
                <button class="add-btn" (click)="uploadGarantie(dossier)">
                  <i class="material-icons">cloud_upload</i>
                  Upload
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Messages d'erreur ou de succès -->
    <div *ngIf="errorMessage" class="error-message">
      <i class="material-icons">error</i>
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="no-dossiers-message">
      <i class="material-icons">check_circle</i>
      <p>{{ successMessage }}</p>
    </div>

    <!-- Message si aucun dossier n'est trouvé -->
    <div *ngIf="!isLoading && dossiers.length === 0" class="no-dossiers-message">
      <i class="material-icons">folder_off</i>
      <p>Aucun dossier trouvé</p>
    </div>
  </div>
</div>
